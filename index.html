<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FPV komanda</title>
<style>
:root{--bg:#111418;--pan:#1b2027;--pan2:#262d36;--ln:#36404c;--tx:#eef1f5;--mut:#9aa4b2;--acc:#4ea1ff;--grn:#2fb36b;--yel:#e3b341;--red:#e5534b;--org:#f08a24;--cy:#38bdf8}
body.light{--bg:#eef1f4;--pan:#fff;--pan2:#eef1f5;--ln:#cdd5df;--tx:#121820;--mut:#56606e}
body.night{--bg:#000;--pan:#0d0000;--pan2:#1a0303;--ln:#3a0b0b;--tx:#ff5a4f;--mut:#a3332c;--acc:#ff5a4f;--grn:#b23a32;--yel:#c2412f;--red:#ff2d20;--org:#c2412f;--cy:#c2412f}
body.night button.g,body.night button.c,body.night button.y,body.night button.b{color:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,Roboto,"Segoe UI",sans-serif}
button{font:inherit;font-weight:650;color:var(--tx);background:var(--pan2);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;min-height:50px;cursor:pointer}
button:active{transform:translateY(1px);filter:brightness(1.15)}
button.g{background:var(--grn);border-color:var(--grn);color:#fff}
button.c{background:var(--cy);border-color:var(--cy);color:#0b1720}
button.y{background:var(--yel);border-color:var(--yel);color:#161100}
button.r{background:var(--red);border-color:var(--red);color:#fff}
button.b{background:var(--acc);border-color:var(--acc);color:#fff}
button.o{background:var(--org);border-color:var(--org);color:#fff}
button.sm{min-height:44px;padding:5px 12px;font-size:15px;border-radius:10px}
button.ghost{background:none;border-color:transparent;color:var(--mut)}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%;min-height:50px}
textarea{min-height:70px;resize:vertical}
input.bad{border-color:var(--red)}
.mono{font-family:ui-monospace,"Roboto Mono",Consolas,monospace}
.mut{color:var(--mut)}.small{font-size:14px}.er{color:#ff7b72}.ok{color:var(--grn)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--pan);border-bottom:1px solid var(--ln)}
header .tm{font-weight:800;font-size:21px}
header .clk{margin-left:auto;font:700 22px ui-monospace,monospace}
header #bHelp{min-width:44px;font-size:20px}
label.hl{display:flex;align-items:center;gap:4px;min-height:30px;cursor:pointer}
label.hl .hi{color:var(--acc);font-size:16px;font-weight:700;margin-left:2px}
.hlp{background:var(--pan2);border-left:3px solid var(--acc);border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.4;margin:2px 0 8px;color:var(--tx)}
.hlp[hidden]{display:none}
.glab .hlp{font-weight:400}
.ovh{margin:-6px 0 8px}
details.adv{background:var(--bg);padding:6px 10px;margin:4px 0 10px}
details.adv summary{color:var(--acc);font-size:15px;min-height:44px}.ovh button{padding-left:0;color:var(--acc)}
.guide{padding-left:20px;margin:0 0 12px}.guide li{margin-bottom:9px}
header button{min-height:42px;padding:4px 12px}
#posbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pan2);border-bottom:1px solid var(--ln);cursor:pointer;font-size:15px}
#posbar .mono{font-size:16px;font-weight:700;white-space:nowrap}
#posbar .pb{display:flex;flex-wrap:wrap;column-gap:8px;align-items:baseline;min-width:0;flex:1}
#posbar .gt{font-size:22px;color:var(--mut)}
#pilbar{display:flex;gap:6px;align-items:center;padding:6px 12px;background:var(--pan);border-bottom:1px solid var(--ln);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#pilbar .pl{font-size:14px;color:var(--mut);flex:none}
#pilbar button{flex:none;min-height:44px;padding:4px 14px;border-radius:22px;font-size:16px}
#pilbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#drbar,#cambar{display:flex;gap:6px;align-items:center;padding:6px 12px;background:var(--pan);border-bottom:1px solid var(--ln)}
#cambar{background:#211a38}body.light #cambar{background:#ece6fb}
#cambar[hidden]{display:none}
#drbar .scr,#cambar .scr{display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none;flex:1;min-width:0}
#drbar .pl,#cambar .pl{font-size:14px;color:var(--mut);flex:none}
#drbar button,#cambar button{flex:none;min-height:44px;padding:4px 14px;border-radius:22px;font-size:16px}
#drbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#drbar .nt{padding:4px 12px}
#drbar .nt.on,#cambar button.on{background:#6a4bc4;border-color:#6a4bc4;color:#fff}
body.night #cambar{background:var(--pan2)}body.night #drbar .nt.on,body.night #cambar button.on{background:var(--acc);border-color:var(--acc);color:#000}
#fileIn{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#bakbar{padding:6px 12px;background:#4a3b10;color:#f6dd96;font-weight:650;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.light #bakbar{background:#fbefc8;color:#6b5100}
.acts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;margin-top:8px}
.acts2 button{min-height:46px;font-size:15px;padding:4px 6px}
#posbar.bad{background:#4a1d1b;color:#ffd3cf}
body.light #posbar.bad{background:#fde0de;color:#8a1c16}
main{padding:12px;padding-bottom:40px;max-width:720px;margin:0 auto}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;letter-spacing:1px;color:var(--mut);margin:0 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.fl .st{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.fl .st b{font-size:24px}
.fl .tmr{margin-left:auto;font:700 26px ui-monospace,monospace}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:800;background:var(--pan2);border:1px solid var(--ln);white-space:nowrap}
.b-REQ{background:var(--cy);color:#0b1720;border-color:var(--cy)}
.b-ORE{background:var(--grn);color:#fff;border-color:var(--grn)}
.b-ŠALTAS{background:#2f6aa1;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>button{flex:1}
#bShare{flex:0 0 auto;width:68px;min-height:0;align-self:stretch;padding:2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:22px;line-height:1;color:var(--mut)}
#bShare small{font-size:11px;font-weight:600;margin-top:3px}
#bShare[hidden]{display:none}
.big{min-height:62px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid button{min-height:64px;font-size:16px;text-align:left;display:flex;align-items:center;gap:10px}
.grid button i{font-style:normal;font-size:24px}
.tgl{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.tg .nm{font-weight:800;font-size:20px;min-width:44px}
.tg .inf{flex:1;min-width:0}
.tg .inf .mono{font-size:15px;white-space:normal;word-break:keep-all}
.tg .inf .small{font-size:13px}
.tg button.c{min-width:0;padding:5px 10px}
.tg button.ghost{padding:4px 6px;min-width:44px}
.tg [data-cp]{padding:6px 0;cursor:pointer}
.hist .m{border-top:1px dashed var(--ln);padding:8px 0;display:flex;gap:8px;align-items:flex-start}
.hist pre{flex:1;margin:0;white-space:pre-wrap;font:14px/1.35 ui-monospace,monospace;max-height:4.2em;overflow:hidden}
.hist .m.open pre{max-height:none}
/* forma */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--pan);border-bottom:1px solid var(--ln)}
#sheet .sh b{font-size:19px;flex:1}
#sheet .sb{flex:1;overflow:auto;padding:12px;max-width:720px;width:100%;margin:0 auto}
#sheet .sf{border-top:1px solid var(--ln);background:var(--pan);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#sheet .sf pre{margin:0 0 8px;max-height:28vh;overflow:auto;white-space:pre-wrap;font:15px/1.35 ui-monospace,monospace;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:14px;color:var(--mut);margin-bottom:5px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:48px;font-size:16px;padding:6px 10px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg.res button[data-sv="HIT"].on{background:var(--grn);border-color:var(--grn)}
.seg.res button[data-sv="LOST"].on{background:var(--red);border-color:var(--red)}
.seg.res button[data-sv="ABORT"].on{background:var(--org);border-color:var(--org)}
.mgf{display:flex;gap:6px}
.mgf input{flex:1}
.mgf button{min-height:50px;padding:4px 10px;font-size:15px}
.mgi{font-size:14px;margin-top:4px}
.auto{padding:11px 12px;border:1px dashed var(--ln);border-radius:10px;min-height:50px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);border-radius:10px;padding:8px 12px;min-height:48px;background:var(--pan2);display:inline-flex;flex-direction:column;justify-content:center;cursor:pointer}
.chip b{font-size:18px}.chip small{color:var(--mut);font-size:12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.chip.on small{color:#e6f0ff}
.warn{background:#5a1f1d;color:#ffd3cf;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:650}
body.light .warn{background:#fde0de;color:#8a1c16}
.note{background:var(--pan2);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.need{color:#ff7b72;font-size:13px;margin-top:3px}
details{border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin-bottom:8px;background:var(--pan)}
details summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:16px}
.chk input{width:24px;height:24px;min-height:0}
.chk.lock{color:var(--mut)}
#toast{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);background:#000e;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:99;max-width:92vw;font-size:16px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:2px}
.frow .fld{margin-bottom:10px}
.frow.cycs{grid-template-columns:repeat(auto-fit,minmax(68px,1fr))}
.glab{font-size:14px;color:var(--tx);font-weight:700;margin:4px 0 6px}
.seg.col{display:grid;grid-template-columns:1fr;gap:6px}
.seg.col button{text-align:left;padding:8px 12px}
@media(min-width:560px){.seg.col{grid-template-columns:1fr 1fr}}
.cyc{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:6px 4px;font-size:13px}
.cyc b{font-size:15px}
.cyc[data-col="žalia"]{background:var(--grn);border-color:var(--grn);color:#fff}
.cyc[data-col="geltona"]{background:var(--yel);border-color:var(--yel);color:#161100}
.cyc[data-col="raudona"]{background:var(--red);border-color:var(--red);color:#fff}
#pv{cursor:pointer}#pv.open{max-height:60vh}
/* maži ekranai */
@media(max-width:380px){
  html,body{font-size:16px}
  header{gap:6px;padding:6px 10px}header .tm{font-size:19px}header .clk{font-size:19px}#hCall{display:none}
  main{padding:8px}.card{padding:10px;border-radius:12px}
  .grid button{min-height:58px;font-size:15px;padding:8px;gap:6px}.grid button i{font-size:20px}
  .big{min-height:56px;font-size:18px}
  .tg{gap:6px;padding:8px}.tg .nm{font-size:18px;min-width:36px}.tg .inf .mono{font-size:14px}
  .mgf button{padding:4px 8px;min-width:44px}
  #sheet .sb{padding:10px}
}
@media(max-width:400px){#drbar .tx,#cambar .tx{display:none}}
@media(max-height:700px){#sheet .sf pre{max-height:17vh}#sheet .sf pre.open{max-height:50vh}.big{min-height:52px}}
</style>
</head>
<body>
<header><span class="tm" id="hTeam">FPV</span><span class="mut small" id="hCall"></span><span class="clk" id="hClk">--:--</span><button id="bHelp" title="Kaip naudotis">?</button><button id="bSet" title="Nustatymai">⚙</button></header>
<div id="posbar"></div>
<div id="pilbar"></div>
<div id="drbar"></div>
<div id="cambar" hidden></div>
<div id="bakbar" hidden></div>
<main>
  <section class="card fl" id="fl"></section>
  <section class="card"><h2>PRANEŠIMAI TOC</h2><div class="grid" id="grid"></div></section>
  <section class="card"><h2>TAIKINIAI <span id="tgCnt" class="mut"></span></h2>
    <div class="row" style="margin-bottom:8px"><textarea id="tocIn" rows="1" placeholder="Nr. (pvz. 12) arba įklijuok TOC žinutę" style="flex:1;min-height:50px" autocapitalize="characters"></textarea><button class="b" id="bToc" style="flex:none;min-width:56px;font-size:22px">+</button></div>
    <div class="tgl" id="tgs"></div></section>
  <section class="card hist"><h2>IŠSIŲSTA</h2><div id="hist"></div></section>
  <div class="row" style="margin-bottom:8px"><button class="sm" data-bak="1">💾 Išsaugoti pratybų failą</button><button class="sm" data-load="1">📂 Įkelti failą</button></div>
  <div class="small mut" style="text-align:center">Duomenys saugomi tik šiame telefone · v17 · TOC lenta v29</div>
  <input type="file" id="fileIn" tabindex="-1" aria-hidden="true">
</main>
<div id="sheet" hidden>
  <div class="sh"><b id="shT"></b><button class="ghost" id="shX" style="font-size:24px">✕</button></div>
  <div class="sb" id="shB"></div>
  <div class="sf" id="shF"><pre id="pv"></pre><div class="row"><button class="b big" id="bCopy">📋 Kopijuoti</button><button id="bShare" title="Siųsti per kitą programėlę (Signal ir kt.)" hidden>↗<small>Siųsti</small></button></div></div>
</div>
<div id="toast"></div>
<script>
"use strict";
/* ============ GEO (MGRS / UTM) ============ */
const D2R=Math.PI/180,R2D=180/Math.PI,WA=6378137,WF=1/298.257223563,K0=0.9996,E2=WF*(2-WF),EP2=E2/(1-E2);
function ll2utm(lat,lon,zone){
  if(!zone) zone=Math.floor((lon+180)/6)+1;
  const lon0=((zone-1)*6-180+3)*D2R,phi=lat*D2R,lam=lon*D2R,s=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi);
  const N=WA/Math.sqrt(1-E2*s*s),T=t*t,C=EP2*c*c,A=c*(lam-lon0),e4=E2*E2,e6=e4*E2;
  const M=WA*((1-E2/4-3*e4/64-5*e6/256)*phi-(3*E2/8+3*e4/32+45*e6/1024)*Math.sin(2*phi)+(15*e4/256+45*e6/1024)*Math.sin(4*phi)-(35*e6/3072)*Math.sin(6*phi));
  const e=K0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*EP2)*A**5/120)+500000;
  let n=K0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*EP2)*A**6/720)); if(lat<0) n+=1e7;
  return {zone,e,n};
}
function utm2ll(e,n,zone,south){ return tmInv(e,south?n-1e7:n,(zone-1)*6-180+3,K0,500000); }
function tmInv(E,N,lon0d,k0,fe){
  const x=E-fe,y=N,lon0=lon0d*D2R,e4=E2*E2,e6=e4*E2;
  const mu=y/k0/(WA*(1-E2/4-3*e4/64-5*e6/256)),e1=(1-Math.sqrt(1-E2))/(1+Math.sqrt(1-E2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const s=Math.sin(p1),c=Math.cos(p1),t=Math.tan(p1),N1=WA/Math.sqrt(1-E2*s*s),T1=t*t,C1=EP2*c*c,R1=WA*(1-E2)/Math.pow(1-E2*s*s,1.5),D=x/(N1*k0);
  const lat=p1-(N1*t/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*EP2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*EP2-3*C1*C1)*D**6/720);
  const lon=lon0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*EP2+24*T1*T1)*D**5/120)/c;
  return {lat:lat*R2D,lon:lon*R2D};
}
const SETCOL=['ABCDEFGH','JKLMNPQR','STUVWXYZ'],ROWL='ABCDEFGHJKLMNPQRSTUV',BANDS='CDEFGHJKLMNPQRSTUVWX';
function mgrsBuild(zone,band,c,r,de,dn){
  zone=+zone;band=band.toUpperCase();c=c.toUpperCase();r=r.toUpperCase();
  if(zone<1||zone>60) return null; const bi=BANDS.indexOf(band); if(bi<0) return null;
  const ci=SETCOL[(zone-1)%3].indexOf(c); if(ci<0) return null; let ri=ROWL.indexOf(r); if(ri<0) return null;
  if(zone%2===0) ri=(ri-5+20)%20;
  if(de.length!==dn.length||de.length<1||de.length>5) return null;
  const mul=10**(5-de.length),half=de.length<5?mul/2:0, e=(ci+1)*100000+parseInt(de,10)*mul+half; let n=ri*100000+parseInt(dn,10)*mul+half;
  const latMin=-80+bi*8,south=latMin<0; let nMin=ll2utm(latMin,(zone-1)*6-180+3,zone).n-100000;
  n+=Math.floor(nMin/2e6)*2e6; while(n<nMin) n+=2e6;
  const ll=utm2ll(e,n,zone,south);
  return {zone,band,e,n,lat:ll.lat,lon:ll.lon,txt:zone+band+' '+c+r+' '+de.padEnd(5,'0')+' '+dn.padEnd(5,'0')};
}
const MG_RE=/(?:^|[^\dA-Z])(\d{1,2})\s?([C-HJ-NP-X])\s?([A-HJ-NP-Z])\s?([A-HJ-NP-V])\s?(\d{2,10})(?:\s+(\d{1,5}))?(?!\d)/i;
const MG_RE2=/(?:^|[^\dA-Z])([A-HJ-NP-Z])([A-HJ-NP-V])\s?(\d{5})\s+(\d{5})(?!\d)/i;
/* kitos koordinačių formos → MGRS: platuma / ilguma (dešimtainės, °′″, ° ir min.), UTM, LKS-94 */
const HEM={N:1,S:-1,E:1,W:-1,'Š':1,P:-1,R:1,V:-1};
const cnum=x=>parseFloat(String(x).replace(',','.'));
const llOk=(a,b)=>isFinite(a)&&isFinite(b)&&Math.abs(a)<84&&Math.abs(b)<=180;
function llOrder(a,b,ha,hb){ const isLon=h=>/[EWRV]/i.test(h||''), isLat=h=>/[NSŠP]/i.test(h||'');
  if(isLon(ha)||isLat(hb)) return [b,a];
  if(!ha&&!hb&&a>=20&&a<=28&&b>=53&&b<=57) return [b,a];   /* Lietuvoje sukeista tvarka (ilguma, platuma) */
  return [a,b]; }
function parseCoord(str){
  let s=String(str).replace(/[″“”]/g,'"').replace(/[′’‘´]/g,"'").replace(/[º˚]/g,'°').replace(/''/g,'"'), m;
  const H='([NSEWŠPRV])', NUM='(\\d{1,3}(?:[.,]\\d+)?)', MIN='(\\d{1,2}(?:[.,]\\d+)?)';
  const dms=(d,mi,se,h)=>(cnum(d)+(mi?cnum(mi)/60:0)+(se?cnum(se)/3600:0))*(HEM[(h||'').toUpperCase()]||1);

    openForm(d.id,d.v,true); if(F) toast('↺ Atkurta neužbaigta forma: '+MSG[d.id].ic+' '+MSG[d.id].t.replace(/ \(.*\)$/,'')); }catch(e){ clearDraft(); } }

    if(f.row){ if(row!==f.row){ if(row) h+='</div>'; row=f.row; const g=(M.sl&&f.sk&&M.sl[f.sk]&&V.findIndex(x=>x.sk===f.sk)===i)?`<div class="glab">${hlab(F.id+'.'+f.sk,esc(M.sl[f.sk]))}</div>`:''; h+=g+`<div class="frow ${V.slice(i).filter(x=>x.row===f.row).every(x=>x.ty==='cyc')?'cycs':''}">`; } }
    else if(row){ h+='</div>'; row=null; }
    if(!f.row&&M.sl&&f.sk&&M.sl[f.sk]&&V.findIndex(x=>x.sk===f.sk)===i&&V.filter(x=>x.sk===f.sk).length>1) h+=`<div class="glab">${hlab(F.id+'.'+f.sk,esc(M.sl[f.sk]))}</div>`;

function setPos(mg,src,acc){ const old=posMg(), m=findMGRS(mg); if(!m) return; S.pos={mg:m.txt,src,acc:acc??null,t:Date.now()}; save(); renderPos(); return old;}
function gps(){ return new Promise(res=>{
  if(!navigator.geolocation){toast('GPS nepasiekiamas šiame naršyklėje');return res(null);}
  toast('📡 Ieškoma GPS…');
  navigator.geolocation.getCurrentPosition(p=>{ const m=ll2mgrs(p.coords.latitude,p.coords.longitude), acc=Math.round(p.coords.accuracy), old=posMg();
      if(old&&mDist(old,m)>5000&&!confirm('⚠ GPS rodo '+km(mDist(old,m))+' km nuo ankstesnės pozicijos. Gal GPS trukdomas / klastojamas? Naudoti vis tiek?')) return res(null);
      if(acc>50) toast('⚠ GPS netikslus (±'+acc+' m) – patikrink'); else toast('✓ GPS ±'+acc+' m');
      res({mg:m.txt,acc,lat:p.coords.latitude,lon:p.coords.longitude}); },
    err=>{toast(err.code===1?'GPS neleidžiamas – leisk naršyklės nustatymuose arba įvesk ranka':'GPS nepavyko ('+(err.code===3?'per ilgai':'nėra signalo')+') – įvesk ranka'); res(null);},
    {enableHighAccuracy:true,timeout:20000,maximumAge:10000}); }); }
function renderPos(){
  const b=$('#posbar'), p=S.pos, age=p?Math.floor((Date.now()-p.t)/60000):0;

}

/* ============ TOC ŽINUTĖS ============ */
function statusOf(up){ if(/UŽDARYT|UZDARYT|CLOSED/.test(up)) return 'UŽDARYTAS'; if(/ŠALT|\bSALT\b|COLD/.test(up)) return 'ŠALTAS'; if(/ATIDARYT|OPEN|KARŠT|HOT/.test(up)) return 'ATIDARYTAS'; return null; }
function parseToc(text){
  const res=[], team=T(), teamRe=new RegExp('(^|[^A-Z0-9])'+team.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^A-Z0-9-]|$)');
  for(const ln of text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)){
    const up=ln.toUpperCase(), own=teamRe.test(up), fidm=ln.match(/#([A-Z0-9ĄČĘĖĮŠŲŪŽ]+-\d+)/i), fid=fidm?fidm[1].toUpperCase():null;
    const tnm=up.match(/(?:^|[^A-Z0-9#])(T\s?\d{1,3})(?![0-9])/), tname=tnm?tnm[1].replace(/\s/g,''):null;
    const fl=()=>{let f=fid?S.flights.find(x=>x.fid===fid):null; if(!f){const a=active(); if(a&&(!tname||a.tg===tname||a.test)) f=a;} return f;};
    if(own&&/\bLEISTA\b/.test(up)&&!/NELEIST/.test(up)){res.push('LEISTA – galite kilti (⬆️ Kylame)'); continue;}
    if(own&&/SULAIKYT/.test(up)){res.push('SULAIKYTA – laukite TOC'); continue;}
    if(own&&/ATŠAUKT|ATSAUKT/.test(up)&&!/UŽDUOTIS/.test(up)){const f=fl(); if(f&&f.st!=='BAIGTA'&&f.st!=='ORE'){f.st='ATŠAUKTA';res.push('✕ atšaukta #'+f.fid);} continue;}
    const mg=findMGRS(ln,defZB()), st=statusOf(up), sq=(ln.match(/\(\s*([A-Z]{1,2}\s?\d{1,3})\s*\)/i)||[])[1];
    const bare=ln.match(/^\s*(?:T\s?)?(\d{1,3})\s*$/i);
    if(bare&&!tname){ const n='T'+bare[1]; if(!tgByName(n)){S.targets.push({name:n,mg:'',st:'ATIDARYTAS',t:Date.now()});res.push('naujas '+n);} else res.push(n+' jau yra'); continue; }
    if(tname&&(mg||st||/UŽDUOTIS/.test(up)||/^\s*T\s?\d{1,3}\s*$/i.test(ln))){
      let t=tgByName(tname); const isNew=!t;
      if(!t&&st==='UŽDARYTAS') continue;
      if(!t){t={name:tname,mg:'',st:'ATIDARYTAS',t:Date.now()};S.targets.push(t);}
      if(mg) t.mg=mg.txt; if(st) t.st=st; if(sq) t.sq=sq.replace(/\s/g,'').toUpperCase(); if(/UŽDUOTIS/.test(up)&&own) t.mine=Date.now(); t.t=Date.now();
      res.push((isNew?'naujas ':'')+tname+(st&&st!=='ATIDARYTAS'?' '+st:''));
    }
  }
  save(); render(); return res.length?[...new Set(res)].join(' · '):'Nieko neatpažinta';
}

/* ============ PRATYBŲ FAILAS (atsarginė kopija telefone) ============ */
function saveFile(silent){
  const d=new Date(), nm=T()+'_pratybos_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json';
  const data=JSON.stringify(Object.assign({},S,{app:'FPV komanda',savedAt:Date.now()}));
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=nm; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    S.dirtyAt=null; S.fileAt=Date.now(); save(); renderBak(); if(!silent) toast('💾 Išsaugota Atsisiuntimuose: '+nm+'. Atkurti – čia „📂 Įkelti failą“');
    return true;
  }catch(e){ if(!silent) toast('Nepavyko išsaugoti failo'); return false; }
}
function readTxt(f){ return new Promise((ok,no)=>{ try{ const r=new FileReader(); r.onload=()=>ok(String(r.result||'')); r.onerror=()=>no(r.error); r.readAsText(f,'utf-8'); }catch(e){ if(f.text) f.text().then(ok,no); else no(e); } }); }
function parseBak(t){
  t=String(t||'').replace(/^\uFEFF/,'').trim(); let o=null;
  try{ o=JSON.parse(t); }catch(e){ const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a){ try{ o=JSON.parse(t.slice(a,b+1)); }catch(e2){} } }
  if(!o||typeof o!=='object'||!o.set||typeof o.set!=='object') return null;
  for(const k of ['flights','targets','sent','places']) if(!Array.isArray(o[k])) o[k]=[];
  return o;
}
function loadBak(o){
  S=Object.assign(defState(),o); S.set=Object.assign(defState().set,o.set); delete S.app; delete S.savedAt; S.dirtyAt=null; S.fileAt=o.savedAt||Date.now();
  if(!S.last||typeof S.last!=='object') S.last={};
  tidyState(); fixShow(); save(); closePanel(); render(); window.scrollTo(0,0); toast('✓ Įkelta: skrydžių '+S.flights.length+', taikinių '+S.targets.length);
}
$('#fileIn').onchange=async e=>{

  const sv=o.savedAt?new Date(o.savedAt):null, nTg=o.targets.filter(t=>t.st!=='UŽDARYTAS').length;
  openPanel('📂 Įkelti pratybų failą',`<div class="note"><b>${esc(f.name)}</b><br>Komanda: <b>${esc(o.set.team||'?')}</b>${sv?' · išsaugota '+pad(sv.getMonth()+1)+'-'+pad(sv.getDate())+' '+hm(sv):''}<br>Skrydžių: ${o.flights.length} · taikinių: ${nTg} · žinučių: ${o.sent.length}</div>
     <div class="warn">Dabartiniai duomenys šiame telefone bus pakeisti šio failo duomenimis.</div>
     <button class="g big" id="ldOk" style="width:100%">✓ Įkelti</button>
     <button id="ldNo" style="width:100%;margin-top:8px">Atšaukti</button>`,()=>{ $('#ldOk').onclick=()=>loadBak(o); $('#ldNo').onclick=()=>closePanel(); });
};

/* ============ NUSTATYMAI ============ */
function dlgSettings(focusId){
  const s=S.set, inp=(id,l,v,ex='')=>`<div class="fld">${hlab('SET.'+id,l,id)}<input id="${id}" value="${esc(v)}" ${ex}></div>`;
  const secs=Object.entries(MSG).filter(([id,M])=>!M.hide).map(([id,M])=>{
    const seen=new Set(), rows=[];
    for(const f of M.f){ const sk=f.sk||f.k; if(seen.has(sk)) continue; seen.add(sk); const nm=(M.sl&&M.sl[sk])||f.n;
      rows.push(f.p==='L'?`<div class="chk lock"><input type="checkbox" checked disabled> 🔒 ${esc(nm)}</div>`:`<label class="chk"><input type="checkbox" data-shid="${id}" data-shk="${sk}" ${shown(id,sk)?'checked':''}> ${esc(nm)}</label>`); }
    return `<details ${focusId===id?'open':''}><summary>${M.ic} ${esc(M.t)}</summary>${rows.join('')}</details>`;}).join('');
  openPanel('⚙ Nustatymai',`
   <h3 style="font-size:16px;margin:0 0 8px">Komanda</h3>
   ${inp('sT','Komandos pavadinimas (kaip TOC lentoje)',s.team,'autocapitalize="characters" placeholder="FPV3"')}
   ${inp('sU','Dalinys (REQ 1 eilutės pradžia, nebūtina)',s.unit,'placeholder="pvz. ALFA"')}
   ${inp('sC','Šaukinys (nebūtina)',s.call)}
   ${inp('sP','Pilotai (per kablelį)',s.pilots,'placeholder="Pilotas1, Pilotas2"')}
   ${inp('sD','Dronai (per kablelį)',s.drones,'placeholder="D-1, D-2"')}
   ${inp('sN','🌙 Naktinės kameros (per kablelį)',s.nightCams,'placeholder="Termo-1, Termo-2"')}
   <div class="two">${inp('sV','Video kanalas / dažnis',s.vtx,'placeholder="R5"')}${inp('sR','Retr. kanalas',s.retr,'placeholder="E7"')}</div>
   ${inp('sE','Valdymas',s.elrs)}
   <h3 style="font-size:16px;margin:16px 0 8px">${hlab('SET.req','Ar TOC reikalauja prašymo kilti (REQ)?')}</h3>
   <div class="seg" id="sNr"><button type="button" data-nr="1" class="${s.needReq!==false?'on':''}">Taip – pirma REQ</button><button type="button" data-nr="0" class="${s.needReq===false?'on':''}">Ne – iškart ⬆️ Kylame</button></div>
   <h3 style="font-size:16px;margin:16px 0 8px">${hlab('SET.grid','Pranešimų mygtukai pagrindiniame lange')}</h3>
   ${GRID.map(id=>GRID_FIX.includes(id)?`<div class="chk lock"><input type="checkbox" checked disabled> 🔒 ${MSG[id].ic} ${esc(MSG[id].t.replace(/ \(.*\)$/,''))}</div>`:`<label class="chk"><input type="checkbox" data-grid="${id}" ${!(s.grid&&s.grid[id]===false)?'checked':''}> ${MSG[id].ic} ${esc(MSG[id].t.replace(/ \(.*\)$/,''))}</label>`).join('')}
   <h3 style="font-size:16px;margin:16px 0 8px">${hlab('SET.stop','🛑 STOP pranešimas')}</h3>
   ${inp('sSw','Kodinis žodis',s.stopWord??STOP_DEF.word,'autocapitalize="characters"')}
   ${inp('sSs','Būsenos (per kablelį; pirma – skelbiame, paskutinė – baigta)',s.stopSt??STOP_DEF.st)}
   <div class="fld">${hlab('SET.sSl','Eilutės (viena eilutė – vienas laukas)','sSl')}<textarea id="sSl" rows="4">${esc(s.stopLines??STOP_DEF.lines)}</textarea></div>
   <div class="fld">${hlab('SET.sSd','Procedūros aprašymas (rodomas paaiškinime)','sSd')}<textarea id="sSd" rows="3">${esc(s.stopDesc??STOP_DEF.desc)}</textarea></div>
   <button class="sm" id="sSr" style="width:100%">↺ Atstatyti STOP pagal nutylėjimą</button>
   <h3 style="font-size:16px;margin:16px 0 8px">${hlab('SET.show','Kokie punktai rodomi pranešimuose')}</h3>
   <div class="row" style="margin-bottom:8px"><button id="prS">Trumpas (pratyboms)</button><button id="prF">Pilnas (NATO)</button></div>
   <div class="small mut" style="margin-bottom:8px">🔒 – būtini punktai (TOC be jų neatpažins).</div>
   ${secs}
   <h3 style="font-size:16px;margin:16px 0 8px">${hlab('SET.share','Bendrinti nustatymus kitoms komandoms')}</h3>
   <div class="small mut" style="margin-bottom:6px">Kodas perduoda rodomus punktus, mygtukus, STOP pranešimą, REQ režimą, dalinį ir valdymą (be komandos pavadinimo, pilotų, dronų, kanalų).</div>
   <button id="exC" style="width:100%">📤 Kopijuoti nustatymų kodą</button>
   <div class="row" style="margin-top:8px"><input id="imC" placeholder="įklijuok kodą KN1:…" style="flex:2"><button id="imB" style="flex:1">📥 Pritaikyti</button></div>
   <h3 style="font-size:16px;margin:16px 0 8px">Ekranas</h3>
   <div class="seg" id="thm">${[['dark','Tamsus'],['light','Šviesus'],['night','Naktinis (raudonas)']].map(([k,n])=>`<button type="button" data-th="${k}" class="${s.theme===k?'on':''}">${n}</button>`).join('')}</div>
   <h3 style="font-size:16px;margin:16px 0 8px">${hlab('SET.bang','Žinutės pradžioje ❗')}</h3>
   <div class="seg"><button type="button" data-bg="1" class="${s.bang!==false?'on':''}">Taip – ❗ prieš kiekvieną žinutę</button><button type="button" data-bg="0" class="${s.bang===false?'on':''}">Ne</button></div>
   <h3 style="font-size:16px;margin:16px 0 8px">${hlab('SET.file','💾 Pratybų failas')}</h3>
   <div class="small mut" style="margin-bottom:8px">Programėlė viską atsimena pati (ir neužbaigtą formą). Failas – atsarginė kopija ar perkėlimui į naują versiją / telefoną; išsaugok, kai pats nori.</div>
   <div class="glab">Priminti išsaugoti failą (kas 30 min):</div>
   <div class="seg" style="margin-bottom:10px"><button type="button" data-rm="0" class="${!s.bakRemind?'on':''}">Ne</button><button type="button" data-rm="1" class="${s.bakRemind?'on':''}">Taip</button></div>
   <div class="row"><button data-bak="1">💾 Išsaugoti failą</button><button data-load="1">📂 Įkelti failą</button></div>
   <div class="small mut" style="margin:6px 0 0">${S.fileAt?'Paskutinį kartą išsaugota '+hm(S.fileAt):'Dar neišsaugota'}. Failas – telefono Atsisiuntimuose (Downloads). Atkurti – tik per „📂 Įkelti failą“ čia: telefono failų programoje jis neatsidaro (tai normalu).</div>
   <h3 style="font-size:16px;margin:16px 0 8px">Duomenys</h3>
   <button class="r" id="clr" style="width:100%">🗑 Naujos pratybos – išvalyti skrydžius, taikinius ir istoriją</button>
   <div class="small mut" style="margin-top:6px">Nustatymai ir išsaugotos vietos lieka. Duomenys niekur nesiunčiami – tik tai, ką pats įklijuoji į Signal.</div>
   <button class="g big" id="sOk" style="width:100%;margin-top:16px">✓ Išsaugoti</button>`,()=>{
    const rd=()=>{Object.assign(s,{team:$('#sT').value.trim().toUpperCase()||'FPV1',unit:$('#sU').value.trim(),call:$('#sC').value.trim(),pilots:$('#sP').value,drones:$('#sD').value,nightCams:$('#sN').value,vtx:$('#sV').value.trim().toUpperCase(),retr:$('#sR').value.trim().toUpperCase(),elrs:$('#sE').value.trim(),
        stopWord:$('#sSw').value.trim().toUpperCase()||'STOP',stopSt:$('#sSs').value.trim()||STOP_DEF.st,stopLines:$('#sSl').value,stopDesc:$('#sSd').value.trim()});
      s.grid=s.grid||{}; document.querySelectorAll('[data-grid]').forEach(c=>{s.grid[c.dataset.grid]=c.checked;});
      document.querySelectorAll('[data-shid]').forEach(c=>{s.show[c.dataset.shid]=s.show[c.dataset.shid]||{};s.show[c.dataset.shid][c.dataset.shk]=c.checked;});};
    $('#prS').onclick=()=>{rd();s.show=presetShow('short');save();dlgSettings();toast('Trumpas rinkinys');};
    $('#prF').onclick=()=>{rd();s.show=presetShow('full');save();dlgSettings();toast('Pilnas rinkinys');};
    $('#exC').onclick=async()=>{rd();save();const code='KN1:'+btoa(unescape(encodeURIComponent(JSON.stringify({show:s.show,showV:SHOWV,unit:s.unit,elrs:s.elrs,grid:s.grid,needReq:s.needReq,stopWord:s.stopWord,stopSt:s.stopSt,stopLines:s.stopLines,stopDesc:s.stopDesc}))));toast(await copy(code)?'Kodas nukopijuotas – siųsk komandoms':'Nepavyko nukopijuoti');};
    $('#imB').onclick=()=>{try{const v=$('#imC').value.trim();if(!v.startsWith('KN1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));rd();
        if(o.show){ s.show=migShow(o.show,o.showV||3)||presetShow('short'); s.showV=SHOWV; } ['unit','elrs','grid','needReq','stopWord','stopSt','stopLines','stopDesc'].forEach(k=>{if(o[k]!==undefined)s[k]=o[k];}); save(); dlgSettings(); toast('✓ Nustatymai pritaikyti');}catch(e){toast('Netinkamas kodas');}};
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{s.bakRemind=b.dataset.rm==='1';document.querySelectorAll('[data-rm]').forEach(x=>x.classList.toggle('on',x===b));});
    document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{s.bang=b.dataset.bg==='1';document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('on',x===b));});
    document.querySelectorAll('#shB [data-bak]').forEach(b=>b.onclick=()=>{rd();save();saveFile();});
    document.querySelectorAll('#shB [data-load]').forEach(b=>b.onclick=()=>$('#fileIn').click());
    document.querySelectorAll('[data-nr]').forEach(b=>b.onclick=()=>{s.needReq=b.dataset.nr==='1';document.querySelectorAll('[data-nr]').forEach(x=>x.classList.toggle('on',x===b));});
    $('#sSr').onclick=()=>{$('#sSw').value=STOP_DEF.word;$('#sSs').value=STOP_DEF.st;$('#sSl').value=STOP_DEF.lines;$('#sSd').value=STOP_DEF.desc;toast('Atstatyta – spausk Išsaugoti');};
    document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{s.theme=b.dataset.th;applyTheme();document.querySelectorAll('[data-th]').forEach(x=>x.classList.toggle('on',x===b));});
    $('#clr').onclick=()=>{if(S.sent.length&&S.dirtyAt&&confirm('Pirma išsaugoti dabartinių pratybų failą?')) saveFile(); if(!confirm('Išvalyti skrydžius, taikinius ir išsiųstų istoriją?'))return;S.dirtyAt=null;S.flights=[];S.targets=[];S.sent=[];S.seq=0;save();closePanel();render();toast('Išvalyta');};
    $('#sOk').onclick=()=>{rd();save();closePanel();render();toast('Išsaugota');};
  });
}
$('#bSet').onclick=()=>dlgSettings();
$('#bHelp').onclick=()=>openPanel('? Kaip naudotis',GUIDE);
function applyTheme(){document.body.classList.toggle('light',S.set.theme==='light');document.body.classList.toggle('night',S.set.theme==='night');
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=S.set.theme==='light'?'#ffffff':S.set.theme==='night'?'#000000':'#111418';}

/* ============ PAGRINDINIS EKRANAS ============ */
let histAll=false;
function renderPil(){
  const P=list(S.set.pilots), c=S.set.curPil||'';
  $('#pilbar').innerHTML=`<span class="pl">👤 Pilotas:</span>`+P.map(p=>`<button type="button" data-pil="${esc(p)}" class="${p===c?'on':''}">${esc(p)}</button>`).join('')
    +(c&&!P.includes(c)?`<button type="button" class="on" data-pil="${esc(c)}">${esc(c)}</button>`:'')+`<button type="button" data-piladd="1" title="Pridėti pilotą">+</button>`+(!P.length&&!c?'<span class="pl">nepasirinktas</span>':'');
}
function chipRow(L,cur,key,addKey,addTitle,empty){
  return L.map(p=>`<button type="button" data-${key}="${esc(p)}" class="${p===cur?'on':''}">${esc(p)}</button>`).join('')
    +(cur&&!L.includes(cur)?`<button type="button" class="on" data-${key}="${esc(cur)}">${esc(cur)}</button>`:'')
    +`<button type="button" data-${addKey}="1" title="${addTitle}">+</button>`+(!L.length&&!cur&&empty?`<span class="pl">${empty}</span>`:'');
}
function renderDr(){
  const s=S.set, n=!!s.night;
  $('#drbar').innerHTML=`<span class="pl">🛩️<span class="tx"> Dronas:</span></span><div class="scr">${chipRow(list(s.drones),s.curDr||'','dr','dradd','Pridėti droną','nepasirinktas')}</div>`
    +`<button type="button" class="nt${n?' on':''}" data-night="1" title="Naktinė kamera">🌙 Naktinė</button>`;
  const cb=$('#cambar'); cb.hidden=!n;
  cb.innerHTML=n?`<span class="pl">🌙<span class="tx"> Kamera:</span></span><div class="scr">${chipRow(list(s.nightCams),s.curCam||'','cam','camadd','Pridėti naktinę kamerą','')}${s.curCam?'':'<span class="pl">pasirink kamerą</span>'}</div>`:'';
}
function drToast(){ const s=S.set; toast((s.curDr?'Dronas: '+s.curDr:'Dronas nepasirinktas')+(s.night?' · 🌙 '+(s.curCam||'naktinė kamera'):'')); }
function renderBak(){
  const b=$('#bakbar'), d=S.dirtyAt, m=d?Math.floor((Date.now()-d)/60000):0;
  b.hidden=!(d&&m>=30&&S.set.bakRemind); if(!b.hidden) b.textContent='💾 Failas neišsaugotas '+m+' min – spausk čia';
}
function render(){
  applyTheme(); $('#hTeam').textContent=T(); $('#hCall').textContent=S.set.call||''; renderPos(); renderPil(); renderDr(); renderBak();
  const f=active(), fl=$('#fl');
  const air=f&&f.st==='ORE', next=f?(air?'DOWN':'UP'):(S.set.needReq===false?'UP':'REQ');
  const A={REQ:['c','✈ Prašymas kilti (REQ)','✈ REQ'],UP:['g','⬆️ Kylame','⬆️ Kylame'],DOWN:['g','⬇️ Rezultatas','⬇️ Rezultatas']};
  const big=`<div class="row"><button class="${A[next][0]} big" data-go="${next}">${A[next][1]}</button></div>`;
  const small=`<div class="acts2">${['REQ','UP','DOWN'].filter(x=>x!==next).map(x=>`<button data-go="${x}">${A[x][2]}</button>`).join('')}${f&&!air?'<button class="ghost" data-go="CANCEL">✕ Atšaukti</button>':''}</div>`;
  fl.innerHTML=!f?`<h2>SKRYDIS</h2>${big}${small}`:
    `<h2>SKRYDIS <span class="mono">#${esc(f.fid)}</span></h2><div class="st"><b>→ ${esc(f.test?'TESTAS':f.tg)}</b><span class="badge b-${air?'ORE':'REQ'}">${air?'ORE':'PRAŠYTA '+hm(f.tReq)}</span>${f.pil?'<span class="mut small">pil. '+esc(f.pil)+'</span>':''}${f.dr||f.cam?'<span class="mut small">'+esc(f.dr||'')+(f.cam?' 🌙'+(camLbl(f.cam)!=='naktinė'?' '+esc(f.cam):''):'')+'</span>':''}${f.vtx&&air?'<span class="mut small">VTX '+esc(f.vtx)+'</span>':''}<span class="tmr" data-since="${air?f.tUp:f.tReq}"></span></div>${big}${small}`;
  $('#grid').innerHTML=GRID.filter(id=>GRID_FIX.includes(id)||!(S.set.grid&&S.set.grid[id]===false)).map(id=>`<button data-go="${id}"><i>${MSG[id].ic}</i>${esc(MSG[id].t.replace(/ \(.*\)$/,''))}</button>`).join('');
  const P=posMg(), L=openTg().map(t=>{const m=findMGRS(t.mg,defZB());return {t,m,d:P&&m?mDist(P,m):null};}).sort((a,b)=>(b.t.mine||0)-(a.t.mine||0)||(a.d??1e12)-(b.d??1e12));
  $('#tgCnt').textContent=L.length?'('+L.length+')':'';
  $('#tgs').innerHTML=L.map(({t,m,d})=>`<div class="tg"><span class="nm">${esc(t.name)}</span><div class="inf"><div>${t.st!=='ATIDARYTAS'?'<span class="badge b-'+t.st+'">'+t.st+'</span> ':''}${t.mine?'<span class="badge">mums</span> ':''}${t.sq?'<span class="small mut">kv. '+esc(t.sq)+'</span>':''}</div>
     <div class="mono" data-cp="${esc(t.mg)}">${t.mg?esc(t.mg):'<span class="mut">be koordinačių</span>'}</div>${d!=null?`<div class="small">${esc(geoTxt(P,m))}</div>`:''}</div>
     ${t.st==='ATIDARYTAS'?`<button class="c sm" data-req="${esc(t.name)}">REQ</button>`:''}<button class="sm ghost" data-tdel="${esc(t.name)}">✕</button></div>`).join('')||'<div class="mut small">Įrašyk Nr. arba įklijuok TOC žinutę su taikiniais. Taikinį galima įrašyti ir tiesiai REQ formoje.</div>';
  const H=S.sent.slice(0,histAll?30:5);
  $('#hist').innerHTML=(H.map((m,i)=>`<div class="m"><span class="small mut">${hm(m.t)}</span><pre data-op="${i}">${esc(m.text)}</pre><button class="sm" data-again="${i}">📋</button></div>`).join('')||'<div class="mut small">Dar nieko</div>')
    +(S.sent.length>5?`<button class="sm ghost" data-hall="1" style="width:100%">${histAll?'▲ Rodyti mažiau':'▼ Rodyti daugiau ('+(Math.min(S.sent.length,30)-5)+')'}</button>`:'');
  tick();
}
document.addEventListener('click',async e=>{
  if($('#sheet').hidden===false&&e.target.closest('#sheet')) return;
  if(e.target.closest('#bakbar')){ saveFile(); return; }
  const b=e.target.closest('[data-go],[data-pil],[data-piladd],[data-dr],[data-dradd],[data-night],[data-cam],[data-camadd],[data-bak],[data-load],[data-hall],[data-req],[data-tdel],[data-again],[data-op],[data-cp]'); if(!b) return; const d=b.dataset;
  if(d.hall){histAll=!histAll;render();return;}
  if(d.go){ const a=active();
    if(d.go==='CANCEL'&&!confirm('Atšaukti skrydį #'+a.fid+'?')) return;
    if(d.go==='UP'&&a&&a.st==='ORE'&&!confirm('#'+a.fid+' jau ore. Siųsti ⬆️ dar kartą?')) return;
    openForm(d.go); return; }
  if(d.pil!==undefined){ S.set.curPil=S.set.curPil===d.pil?'':d.pil; save(); renderPil(); toast(S.set.curPil?'Pilotas: '+S.set.curPil:'Pilotas nepasirinktas'); return; }
  if(d.piladd){ const n=(prompt('Piloto vardas')||'').trim(); if(!n) return; const P=list(S.set.pilots); if(!P.includes(n)) P.push(n); S.set.pilots=P.join(', '); S.set.curPil=n; save(); renderPil(); return; }
  if(d.dr!==undefined){ S.set.curDr=S.set.curDr===d.dr?'':d.dr; save(); renderDr(); drToast(); return; }
  if(d.dradd){ const n=(prompt('Drono ID / tipas (pvz. D-3)')||'').trim(); if(!n) return; const L=list(S.set.drones); if(!L.includes(n)) L.push(n); S.set.drones=L.join(', '); S.set.curDr=n; save(); renderDr(); drToast(); return; }
  if(d.night){ const s=S.set; s.night=!s.night;
    if(s.night&&!s.curCam){ const C=list(s.nightCams);
      if(C.length===1) s.curCam=C[0];
      else if(!C.length){ const n=(prompt('Naktinės kameros pavadinimas (pvz. Termo-1). Galima palikti tuščią.')||'').trim(); if(n){ s.nightCams=n; s.curCam=n; } } }
    save(); renderDr(); drToast(); return; }
  if(d.cam!==undefined){ S.set.curCam=S.set.curCam===d.cam?'':d.cam; save(); renderDr(); drToast(); return; }
  if(d.camadd){ const n=(prompt('Naktinės kameros pavadinimas (pvz. Termo-1)')||'').trim(); if(!n) return; const L=list(S.set.nightCams); if(!L.includes(n)) L.push(n); S.set.nightCams=L.join(', '); S.set.curCam=n; save(); renderDr(); drToast(); return; }
  if(d.bak){ saveFile(); return; }
  if(d.load){ $('#fileIn').click(); return; }
  if(d.req){openForm('REQ',{tg:d.req}); return;}
  if(d.tdel){if(!confirm('Pašalinti '+d.tdel+'?'))return; S.targets=S.targets.filter(t=>t.name!==d.tdel); save(); render(); return;}
  if(d.again){toast(await copy(S.sent[+d.again].text)?'Nukopijuota dar kartą':'Nepavyko nukopijuoti'); return;}
  if(d.op!==undefined){b.parentElement.classList.toggle('open'); return;}
  if(d.cp){toast(await copy(d.cp)?'Koordinatės nukopijuotos':'Nepavyko'); return;}
});
function tick(){const d=new Date();$('#hClk').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  document.querySelectorAll('[data-since]').forEach(e=>{const t=+e.dataset.since;e.textContent=t?dur(Date.now()-t):'';});}
setInterval(tick,1000); setInterval(()=>{renderPos();renderBak();},60000);
render(); restoreDraft();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if(!localStorage.getItem(LS)) setTimeout(()=>{toast('Pirmiausia ⚙ – įrašyk komandos pavadinimą (arba 📂 įkelk pratybų failą)');},600);
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
